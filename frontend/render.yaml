services:
  # ── Frontend (React/Vite) ──
  - type: web
    name: radha-trading-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://radha-trading.onrender.com
      - key: VITE_AI_SERVICE_URL
        value: https://radha-ai-service.onrender.com
    healthCheckPath: /
    autoDeploy: true

  # ── AI Sentiment Microservice (Python/FastAPI) ──
  - type: web
    name: radha-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn sentiment_service:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.13.0
    healthCheckPath: /health
    autoDeploy: true